pre-commit:
  commands:
    prettier-fix:
      glob: "*.{js,ts,json,css}"
      run: pnpm prettier --write {staged_files}
      stage_fixed: true
      priority: 1

    herb-format-fix:
      glob: "*.erb"
      run: pnpm herb:format {staged_files}
      stage_fixed: true
      priority: 1

    herb-lint-fix:
      glob: "*.erb"
      run: pnpm herb:lint --fix {staged_files}
      stage_fixed: true
      priority: 1

    rubocop-fix:
      glob: "*.rb"
      run: bundle exec rubocop -A --force-exclusion {staged_files}
      stage_fixed: true
      priority: 1

    herb-lint:
      glob: "*.erb"
      run: pnpm herb:lint {staged_files}
      priority: 2

    rubocop:
      glob: "*.rb"
      run: bundle exec rubocop --force-exclusion {staged_files}
      priority: 2

pre-push:
  parallel: true
  commands:
    brakeman:
      run: bundle exec brakeman -q --no-pager
    bundler-audit:
      run: bundle exec bundle-audit check --update
    pnpm-audit:
      run: pnpm audit --audit-level moderate
