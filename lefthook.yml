pre-commit:
  parallel: true
  commands:
    rubocop:
      glob: "*.rb"
      run: bundle exec rubocop --force-exclusion {staged_files}

    erb-formatter:
      glob: "*.erb"
      run: bundle exec erb-format --check {staged_files}

    prettier:
      glob: "*.{js,ts,json,css}"
      run: yarn prettier --check {staged_files}
