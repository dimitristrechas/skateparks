pre-commit:
  parallel: true
  commands:
    rubocop:
      glob: "*.rb"
      run: bundle exec rubocop --force-exclusion {staged_files}

    prettier:
      glob: "*.{js,ts,json,css}"
      run: yarn prettier --check {staged_files}

pre-push:
  commands:
    brakeman:
      run: bundle exec brakeman -q --no-pager

