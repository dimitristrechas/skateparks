  cookie_consent:
    aria_label: "Συγκατάθεση cookies"
    message: "Χρησιμοποιούμε cookies και local storage σε αυτόν τον ιστότοπο. Με τη συγκατάθεσή σας, χρησιμοποιούμε επίσης analytics cookies για τη συλλογή ανώνυμων στατιστικών χρήσης και καταγραφών συνεδριών, ώστε να κατανοήσουμε πώς χρησιμοποιείται το skateparks.gr και να το βελτιώσουμε. Τα analytics cookies δεν είναι απαραίτητα—μπορείτε να χρησιμοποιήσετε τον ιστότοπο χωρίς αυτά. Μπορείτε να ανακαλέσετε τη συγκατάθεσή σας ανά πάσα στιγμή."
    accept: "Αποδοχή analytics"
    reject: "Απόρριψη analytics"
    learn_more: "Μάθετε περισσότερα"
  privacy:
    title: "Απόρρητο & cookies"
    meta_description: "Πώς το skateparks.gr χρησιμοποιεί cookies, local storage και analytics—και πώς μπορείτε να διαχειριστείτε τη συγκατάθεσή σας."
    intro: "Το skateparks.gr σέβεται το απόρρητό σας. Αυτή η σελίδα εξηγεί ποια δεδομένα αποθηκεύουμε στον browser σας, πώς χρησιμοποιούμε analytics για τη βελτίωση του ιστότοπου και ποιες επιλογές έχετε σύμφωνα με τον GDPR και παρόμοιους κανονισμούς."
    cookies_heading: "Cookies και local storage"
    cookies_body: "Χρησιμοποιούμε local storage στον browser για να θυμόμαστε την προτίμησή σας για θέμα (φωτεινό ή σκοτεινό). Αυτό είναι απαραίτητο ώστε ο ιστότοπος να εμφανίζεται σωστά σε επόμενες επισκέψεις και δεν σας παρακολουθεί σε άλλους ιστότοπους."
    analytics_heading: "Analytics"
    analytics_body: "Με τη συγκατάθεσή σας, χρησιμοποιούμε PostHog analytics για τη συλλογή ανώνυμων στατιστικών χρήσης και καταγραφών συνεδριών. Αυτό μας βοηθά να κατανοήσουμε πώς χρησιμοποιείται το skateparks.gr—όπως ποιες σελίδες επισκέπτονται οι χρήστες και πώς πλοηγούνται—ώστε να το βελτιώσουμε. Οι καταγραφές συνεδριών καταγράφουν αλληλεπιδράσεις στη σελίδα (κλικ, κύλιση), αλλά ρυθμίζουμε το PostHog ώστε να αποφεύγει τη συλλογή προσωπικά αναγνωρίσιμων πληροφοριών. Τα analytics cookies και η αποθήκευση δεν είναι απαραίτητα· μπορείτε να χρησιμοποιήσετε τον ιστότοπο χωρίς αυτά."
    rights_heading: "Τα δικαιώματά σας"
    rights_body: "Σύμφωνα με τον GDPR, έχετε το δικαίωμα να ανακαλέσετε τη συγκατάθεσή σας ανά πάσα στιγμή, να ζητήσετε πληροφορίες για τα δεδομένα που διατηρούμε και να υποβάλετε καταγγελία στην εποπτική αρχή σας. Η ανάκληση της συγκατάθεσης για analytics σταματά τη μελλοντική συλλογή και διαγράφει τα cookies και το local storage του PostHog στη συσκευή σας."
    consent_heading: "Διαχείριση συγκατάθεσης"
    consent_body: "Χρησιμοποιήστε τα παρακάτω κουμπιά για να αποδεχτείτε ή να απορρίψετε τα analytics cookies. Η επιλογή σας αποθηκεύεται στον browser σας μέχρι να την αλλάξετε εδώ ή να διαγράψετε τα δεδομένα του ιστότοπου."
