name: skateparks

services:
  skateparks-db:
    image: postgres:18-alpine
    container_name: skateparks-db
    command: "postgres -c 'max_connections=500'"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGUSER: ${POSTGRES_USER}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 30

  skateparks-redis:
    image: redis:8-alpine
    container_name: skateparks-redis
    command: redis-server
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  skateparks-web:
    container_name: skateparks-web
    image: skateparks-dev
    build:
      context: .
      dockerfile: Dockerfile.development
    tty: true
    stdin_open: true
    env_file:
      - .env
    environment:
      PORT: ${PORT:-3002}
      LISTEN_GEM_USE_POLLING: "true"
    volumes:
      - app-storage:/rails/storage
      - ${CODEBASE_VOLUME}:/rails
    depends_on:
      skateparks-db:
        condition: service_healthy
      skateparks-redis:
        condition: service_healthy
    ports:
      - "3002:3002"
    command: foreman start -f Procfile.dev

volumes:
  postgres_data: {}
  app-storage: {}
  redis_data: {}
