name: CI/CD

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - "LICENSE"
      - ".gitignore"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  RUBY_VERSION: 3.3.6
  NODE_VERSION: 20

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: components
            test_dirs: test/components
          - name: core
            test_dirs: test/controllers test/models test/helpers test/jobs test/workers test/mailers test/channels

    name: test (${{ matrix.name }})

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: skateparks
          POSTGRES_PASSWORD: skateparks
          POSTGRES_DB: skateparks_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
          --health-start-period 5s

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
          --health-start-period 5s

    env:
      RAILS_ENV: test
      POSTGRES_HOST: localhost
      POSTGRES_DB: skateparks_test
      POSTGRES_USER: skateparks
      POSTGRES_PASSWORD: skateparks
      REDIS_URL: redis://localhost:6379
      RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
      RUBY_YJIT_ENABLE: "0"
      DISABLE_SIMPLECOV: "true"

    steps:
      - uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Install JS dependencies
        run: yarn install --frozen-lockfile

      - name: Cache compiled assets
        id: cache-assets
        uses: actions/cache@v5
        with:
          path: |
            public/assets
            app/assets/builds
          key: assets-${{ runner.os }}-${{ hashFiles('app/assets/**', 'app/javascript/**', 'app/stylesheets/**', 'package.json', 'yarn.lock', 'Gemfile.lock') }}
          restore-keys: |
            assets-${{ runner.os }}-

      - name: Setup database
        run: bundle exec rails db:create db:schema:load

      - name: Precompile assets
        if: steps.cache-assets.outputs.cache-hit != 'true'
        run: bundle exec rails assets:precompile

      - name: Run tests (${{ matrix.name }})
        run: bundle exec rails test ${{ matrix.test_dirs }}

  rubocop-brakeman:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RAILS_ENV: test
      RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
      - run: bundle exec rails zeitwerk:check
      - run: bundle exec rubocop --force-exclusion
      - run: bundle exec brakeman -q --no-pager
      - run: bundle exec bundle-audit check --update

  herb-prettier:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn prettier:check
      - run: yarn herb:lint
      - run: yarn herb:format:check
      - run: yarn audit --audit-level moderate
