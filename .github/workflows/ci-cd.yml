name: CI/CD

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - "LICENSE"
      - ".gitignore"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref_name || github.head_ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  RUBY_VERSION: 3.3.6
  NODE_VERSION: 24.14.0
  ACTIONLINT_VERSION: 1.7.11
  HADOLINT_VERSION: 2.14.0
  DOCKER_CACHE_SCOPE: application-image-arm64
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Install actionlint
        run: |
          curl -sSLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          grep " actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz$" "actionlint_${ACTIONLINT_VERSION}_checksums.txt" | sha256sum --check
          tar -xzf "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" actionlint
          chmod +x actionlint

      - name: Run actionlint
        run: ./actionlint

      - name: Install hadolint
        run: |
          curl -sSLO "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-linux-x86_64"
          curl -sSLO "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-linux-x86_64.sha256"
          sha256sum --check hadolint-linux-x86_64.sha256
          chmod +x hadolint-linux-x86_64

      - name: Run hadolint
        run: |
          ./hadolint-linux-x86_64 --failure-threshold error Dockerfile
          ./hadolint-linux-x86_64 --failure-threshold error Dockerfile.development
          ./hadolint-linux-x86_64 --failure-threshold error Dockerfile.test

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: skateparks
          POSTGRES_PASSWORD: skateparks
          POSTGRES_DB: skateparks_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
          --health-start-period 5s

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
          --health-start-period 5s

    env:
      RAILS_ENV: test
      POSTGRES_HOST: localhost
      POSTGRES_DB: skateparks_test
      POSTGRES_USER: skateparks
      POSTGRES_PASSWORD: skateparks
      REDIS_URL: redis://localhost:6379
      RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
      RUBY_YJIT_ENABLE: "0"
      DISABLE_SIMPLECOV: "true"

    steps:
      - uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true

      - name: Cache compiled assets
        id: cache-assets
        uses: actions/cache@v5
        with:
          path: |
            public/assets
            app/assets/builds
          key: assets-${{ runner.os }}-${{ hashFiles('app/assets/**', 'app/javascript/**', 'app/stylesheets/**', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'Gemfile.lock') }}
          restore-keys: |
            assets-${{ runner.os }}-

      - name: Set up Node
        if: steps.cache-assets.outputs.cache-hit != 'true'
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Enable Corepack
        if: steps.cache-assets.outputs.cache-hit != 'true'
        run: corepack enable

      - name: Install JS dependencies
        if: steps.cache-assets.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Setup database
        run: bundle exec rails db:create db:schema:load

      - name: Precompile assets
        if: steps.cache-assets.outputs.cache-hit != 'true'
        run: bundle exec rails assets:precompile

      - name: Run tests
        run: bundle exec rails test test/components test/controllers test/models test/helpers test/jobs test/workers test/mailers test/channels

  rubocop-brakeman:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RAILS_ENV: test
      RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
      - run: bundle exec rails zeitwerk:check
      - run: bundle exec rubocop --force-exclusion
      - run: bundle exec brakeman -q --no-pager
      - run: bundle exec bundle-audit check --update

  herb-prettier:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm prettier:check
      - run: pnpm herb:lint
      - run: pnpm herb:format:check
      - run: pnpm audit --audit-level moderate

  docker-validate:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    needs:
      - workflow-lint
      - test
      - rubocop-brakeman
      - herb-prettier
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate application image build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: false
          cache-from: type=gha,scope=${{ env.DOCKER_CACHE_SCOPE }}
          cache-to: type=gha,mode=max,scope=${{ env.DOCKER_CACHE_SCOPE }}

  docker-publish:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    needs:
      - workflow-lint
      - test
      - rubocop-brakeman
      - herb-prettier
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v6

      - name: Normalize image name
        id: image
        env:
          IMAGE_OWNER: ${{ github.repository_owner }}
        run: echo "name=ghcr.io/${IMAGE_OWNER,,}/skateparks" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push application image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ env.DOCKER_CACHE_SCOPE }}
          cache-to: type=gha,mode=max,scope=${{ env.DOCKER_CACHE_SCOPE }}

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - docker-publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Dokploy deployment webhook
        env:
          DOKPLOY_WEBHOOK_KEY: ${{ secrets.DOKPLOY_WEBHOOK_KEY }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          IMAGE_NAME: ${{ needs.docker-publish.outputs.image }}
          IMAGE_DIGEST: ${{ needs.docker-publish.outputs.digest }}
        run: |
          if [ -z "$DOKPLOY_WEBHOOK_KEY" ]; then
            echo "DOKPLOY_WEBHOOK_KEY secret is not set"
            exit 1
          fi

          dokploy_webhook_url="https://admin.dimitristrechas.com/api/deploy/$DOKPLOY_WEBHOOK_KEY"
          short_sha="${GITHUB_SHA::7}"
          echo "Triggering Dokploy deployment for ${IMAGE_NAME}:latest"
          echo "Published image digest: ${IMAGE_DIGEST}"
          payload="$(jq -n \
            --arg ref "$GITHUB_REF" \
            --arg id "$short_sha" \
            --arg msg "$COMMIT_MESSAGE" \
            '{ref: $ref, head_commit: {id: $id, message: $msg}}')"

          response_body="$(mktemp)"
          trap 'rm -f "$response_body"' EXIT

          http_code="$(curl -sS -o "$response_body" -w "%{http_code}" -X POST \
            "$dokploy_webhook_url" \
            -H 'Content-Type: application/json' \
            -H 'X-GitHub-Event: push' \
            -d "$payload")"

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "Dokploy deployment failed with HTTP status $http_code"
            cat "$response_body"
            exit 1
          fi

          echo "Dokploy deployment triggered successfully"
          echo "Container health is now evaluated by the image HEALTHCHECK inside the app container."
