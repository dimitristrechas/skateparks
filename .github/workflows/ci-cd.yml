name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUBY_VERSION: 3.3.6
  NODE_VERSION: 20

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      matrix:
        include:
          - name: components
            test_dirs: test/components
          - name: core
            test_dirs: test/controllers test/models test/helpers test/jobs test/workers test/mailers

    name: test (${{ matrix.name }})

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: skateparks
          POSTGRES_PASSWORD: skateparks
          POSTGRES_DB: skateparks_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test
      POSTGRES_HOST: localhost
      POSTGRES_DB: skateparks_test
      POSTGRES_USER: skateparks
      POSTGRES_PASSWORD: skateparks
      REDIS_URL: redis://localhost:6379
      RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
      RUBY_YJIT_ENABLE: "0"
      DISABLE_SIMPLECOV: "true"

    steps:
      - uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Install JS dependencies
        run: yarn install --frozen-lockfile

      - name: Setup database
        run: bundle exec rails db:create db:schema:load

      - name: Check autoloader
        run: bundle exec rails zeitwerk:check

      - name: Precompile assets
        run: bundle exec rails assets:precompile

      - name: Run tests (${{ matrix.name }})
        run: bundle exec rails test ${{ matrix.test_dirs }}

  rubocop-brakeman:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
      - run: bundle exec rubocop --force-exclusion
      - run: bundle exec brakeman -q --no-pager
      - run: bundle exec bundle-audit check --update

  herb-prettier:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn prettier:check
      - run: yarn herb:lint
      - run: yarn herb:format:check
      - run: yarn audit --audit-level moderate
