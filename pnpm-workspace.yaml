# Dependency overrides only. This is a single-package Rails app, not a pnpm workspace:
# there is no `packages/` tree and no `workspaces` field in package.json.
engineStrict: true
overrides:
  dompurify: ">=3.4.17"
  nanoid: ">=3.3.18"
  picomatch: "^4.0.4"
  postcss: ">=8.5.29"
  postcss-selector-parser: ">=7.1.6"
  source-map-js: ">=1.2.2"
  yaml: "^2.8.3"
